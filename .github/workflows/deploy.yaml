name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~

            # Clone or update repo
            if [ -d "DevOpsAgentCOESampleProject" ]; then
              cd DevOpsAgentCOESampleProject
              git pull
            else
              git clone https://github.com/JoelThomas0/DevOpsAgentCOESampleProject.git
              cd DevOpsAgentCOESampleProject
            fi

            # Stop old containers
            docker compose down || true

            # Build and run containers
            docker compose up --build -d

            # Show running containers (for debugging)
            docker ps
